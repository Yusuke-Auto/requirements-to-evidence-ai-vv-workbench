name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-vv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public safety check
        run: python scripts/public_safety_check.py
      - name: Build dashboard
        run: python scripts/build_dashboard.py
      - name: Reproduce offline work sample
        run: python scripts/run_public_demo.py
